{% extends "base.html" %}
{% block title %}My Profile — PlacementHub{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
  <div class="col-12 col-md-10 col-lg-8">
    <div class="d-flex align-items-center gap-3 border-bottom custom-border pb-3 mb-4">
      <div class="bg-coral-dim text-coral rounded-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 48px; height: 48px;">
        <i class="bi bi-person-circle fs-4"></i>
      </div>
      <div>
        <h3 class="mb-1 text-white tracking-tight">My Profile</h3>
        <p class="text-muted font-mono small mb-0">Keep your academic profile complete to improve your chances.</p>
      </div>
    </div>

    <div class="glass-card p-4 p-md-5 mb-5">
      <form method="POST" enctype="multipart/form-data">

        <div class="mb-4">
          <label class="form-label" for="name">Full Name <span class="text-coral">*</span></label>
          <input type="text" name="name" id="name" class="form-control" value="{{ student.name }}" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" value="{{ student.email }}" disabled>
        </div>

        <div class="mb-4">
          <label class="form-label" for="student_id">Student ID / Roll Number</label>
          <input type="text" name="student_id" id="student_id" class="form-control" value="{{ student.username or '' }}" placeholder="e.g. CS21B001">
        </div>

        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <label class="form-label" for="branch">Branch</label>
            <input type="text" name="branch" id="branch" class="form-control" value="{{ student.branch or '' }}" placeholder="e.g. CSE">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" name="phone" id="phone" class="form-control" value="{{ student.phone or '' }}">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="cgpa">Cumulative GPA (CGPA)</label>
          <input type="number" name="cgpa" id="cgpa" class="form-control" step="0.01" min="0" max="10" value="{{ student.cgpa or '' }}" placeholder="e.g. 8.5">
        </div>

        <div class="mb-5">
          <label class="form-label" for="resume">Resume (PDF / DOC / DOCX)</label>
          <input type="file" name="resume" id="resume" class="form-control bg-transparent text-muted" accept=".pdf,.doc,.docx">
          {% if student.resume_path %}
          <div class="d-flex align-items-center gap-2 mt-3 p-3 rounded-2" style="background-color: var(--surface2); border: 1px solid var(--border);">
            <i class="bi bi-file-earmark-pdf-fill text-brand fs-4"></i>
            <div class="flex-grow-1 overflow-hidden font-mono small">
              <span class="text-muted">Current file:</span><br>
              <span class="text-white text-truncate d-block">{{ student.resume_path }}</span>
            </div>
            <a href="{{ url_for('static', filename='resumes/' + student.resume_path) }}" target="_blank" class="btn btn-sm btn-outline-primary shadow-sm rounded-pill font-mono px-3">
              View
            </a>
          </div>
          {% endif %}
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 font-mono tracking-tight shadow-sm">
          <i class="bi bi-floppy me-2"></i> Save Profile
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
