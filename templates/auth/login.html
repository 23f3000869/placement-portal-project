{% extends "base.html" %}
{% block title %}Login — PlacementHub{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
  <div class="col-12 col-md-8 col-lg-5 col-xl-4 transition-base">
    <div class="glass-card p-5">
      <div class="text-center mb-5">
        <div class="d-inline-flex justify-content-center align-items-center bg-purple-dim text-purple rounded-3 mb-3" style="width: 64px; height: 64px;">
          <i class="bi bi-mortarboard-fill fs-2"></i>
        </div>
        <h2 class="page-title tracking-tight mb-1">PlacementHub</h2>
        <p class="text-muted font-mono small">Sign in to your account</p>
      </div>

      <form method="POST" id="loginForm" novalidate>
        <div class="mb-4">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent custom-border text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" id="email" class="form-control border-start-0 ps-0" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>
        
        <div class="mb-5">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent custom-border text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="password" class="form-control border-start-0 border-end-0 px-0" placeholder="••••••••" required autocomplete="current-password">
            <button class="btn btn-outline-secondary custom-border text-muted bg-transparent border-start-0" type="button" onclick="togglePwd()" tabindex="-1">
              <i class="bi bi-eye-slash" id="pwdIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 shadow-sm font-mono fs-6 tracking-tight mb-4">
          Sign In <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </form>

      <div class="position-relative mb-4 text-center">
        <hr class="custom-border my-0" style="opacity: 0.5;">
        <span class="position-absolute top-50 start-50 translate-middle px-3 text-muted font-mono small rounded-pill" style="background-color: var(--surface);">OR</span>
      </div>

      <p class="text-center text-muted small mb-0">
        Don't have an account? 
        <a href="{{ url_for('auth.register') }}" class="text-brand fw-medium text-decoration-none">Create one</a>
      </p>
    </div>
  </div>
</div>

{% block scripts %}
<script>
function togglePwd() {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('pwdIcon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.className = 'bi bi-eye';
  } else {
    pwd.type = 'password';
    icon.className = 'bi bi-eye-slash';
  }
}
</script>
{% endblock %}
{% endblock %}
